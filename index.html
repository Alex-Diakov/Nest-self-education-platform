    <script>
      // Gracefully prevent noisy Vite HMR WebSocket connection errors in sandbox environment
      window.addEventListener('error', function(e) {
        if (e && (e.message && e.message.includes('WebSocket') || e.filename && e.filename.includes('@vite/client'))) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && String(e.reason).includes('WebSocket')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
